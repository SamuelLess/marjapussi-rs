[package]
name = "marjapussi"
version = "0.1.3"
license = "GPL-3.0"
readme = "README.md"
description = "Implements the Finnish card game Marjapussi."
authors = ["Samuel Leßmann <samuel@lessmann.dev>"]
repository = "https://github.com/SamuelLess/marjapussi-rs"
edition = "2021"

[[bin]]
name = "interactive"
path = "src/bin/interactive.rs"
bench = false
required-features = ["public-api"]

[[bin]]
name = "parse"
path = "src/bin/parse_legacy.rs"
bench = false
required-features = ["public-api"]

[features]
default = ["public-api"]
public-api = ["dep:chrono", "dep:strum", "dep:strum_macros", "dep:serde_json", "dep:clap", "dep:indicatif"]

[dependencies]
strum = { version = "0.27.1", optional = true }
strum_macros = { version = "0.27.1", optional = true }
chrono = { version = "0.4.40", optional = true }
rand = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
serde_with = "3.12.0"
clap = { version = "4.5.32", optional = true }
indicatif = { version = "0.17.11", optional = true }
